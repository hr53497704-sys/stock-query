<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:15px;font-weight:700}
.logo-sub{font-size:10px;color:#8b949e}
.badge-live{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.3);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700}
.live-dot{width:7px;height:7px;background:#10b981;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.container{max-width:980px;margin:0 auto;padding:28px 16px 60px}
.search-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px;margin-bottom:24px}
.search-label{font-size:13px;color:#8b949e;margin-bottom:10px;font-weight:500}
.search-row{display:flex;gap:10px}
.search-input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px 16px;color:#e6edf3;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.search-input:focus{border-color:#3b82f6}
.search-input::placeholder{color:#8b949e}
.btn-search{background:#2563eb;color:white;border:none;border-radius:8px;padding:12px 26px;font-size:14px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s}
.btn-search:hover:not(:disabled){background:#3b82f6}

.quick-picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}

.chip{background:#1c2230;border:1px solid #30363d;border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;color:#e6edf3;transition:all .15s}
.chip:hover{border-color:#3b82f6;color:#3b82f6}
.loading{display:none;padding:50px 0;text-align:center}
.spinner{width:44px;height:44px;border:3px solid #30363d;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-steps{display:flex;flex-direction:column;gap:6px;margin-top:12px;align-items:flex-start;display:inline-flex}
.step-item{font-size:13px;color:#8b949e;display:flex;align-items:center;gap:8px}
.step-item.done{color:#10b981}
.step-item.active{color:#3b82f6}
.step-icon{width:16px;text-align:center}
.error-box{display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.4);border-radius:10px;padding:14px 18px;color:#fca5a5;font-size:13px;margin-bottom:18px}
.result-area{display:none}
/* 股票標頭 */

.stock-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.stock-name{font-size:26px;font-weight:900}
.stock-code{font-size:13px;color:#8b949e;margin-top:4px}
.industry-badge{background:rgba(37,99,235,0.15);color:#3b82f6;border:1px solid rgba(37,99,235,0.3);border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700}
/* 即時股價 */
.price-section{margin-top:16px;padding:16px;background:#0d1117;border-radius:10px;border:1px solid #30363d}
.price-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.price-main{display:flex;align-items:baseline;gap:12px}
.price-num{font-size:36px;font-weight:900;color:#e6edf3}

.price-down{color:#ef4444;font-size:14px;font-weight:700}
.price-stats{display:grid;grid-template-columns:repeat(4,auto);gap:16px}
.pstat{text-align:center}
.pstat-label{font-size:10px;color:#8b949e;margin-bottom:3px}
.pstat-val{font-size:13px;font-weight:700}
.source-tag{font-size:10px;color:#10b981;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:4px;padding:2px 7px;display:inline-block;margin-top:8px}
.ai-tag{font-size:10px;color:#f59e0b;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:4px;padding:2px 7px;display:inline-block}
/* 資訊卡 */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.icard{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px 18px}
.icard-label{font-size:11px;color:#8b949e;margin-bottom:7px}
.icard-val{font-size:20px;font-weight:900}
.icard-sub{font-size:11px;color:#8b949e;margin-top:4px}
.c-green{color:#10b981}.c-gold{color:#f59e0b}.c-blue{color:#3b82f6}.c-red{color:#ef4444}
/* 章節卡 */
.scard{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px 24px;margin-bottom:18px}
.scard-title{font-size:13px;font-weight:700;color:#8b949e;border-bottom:1px solid #30363d;padding-bottom:10px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* EPS表格 */
.eps-tbl{width:100%;border-collapse:collapse;font-size:13px}
.eps-tbl th{background:#1c2230;color:#8b949e;padding:8px 12px;text-align:left;font-weight:500;font-size:11px}

.ep{color:#10b981;font-weight:700}.en{color:#ef4444;font-weight:700}
/* 圖表 */
.chart-wrap{height:260px;position:relative;margin-top:10px}
/* ROE儀表 */
.roe-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.roe-big{font-size:48px;font-weight:900;line-height:1}
.roe-bar-bg{height:8px;background:#30363d;border-radius:8px;overflow:hidden;margin:8px 0 4px}
.roe-bar-fill{height:100%;border-radius:8px;transition:width 1s ease}
.roe-labels{display:flex;justify-content:space-between;font-size:10px;color:#8b949e}
/* 風險 */
.risk-list{display:flex;flex-direction:column;gap:8px}
.risk-row{display:flex;gap:10px;padding:11px 13px;background:#1c2230;border-radius:8px;font-size:13px;line-height:1.6}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* 免責 */
.disclaimer{text-align:center;font-size:11px;color:#8b949e;margin-top:6px;padding:14px;border-top:1px solid #30363d}
.notice{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:9px 13px;font-size:12px;color:#f59e0b;margin-top:10px}
@media(max-width:640px){.cards-grid{grid-template-columns:1fr 1fr}.search-row{flex-direction:column}.price-stats{grid-template-columns:repeat(2,auto)}}
</style>

<div class="topbar">

<script>
const GROQ_KEY = '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';
let epsChart = null;

function qp(v){ document.getElementById('si').value=v; doSearch(); }
document.getElementById('si').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

function setStep(n, status){
  for(let i=1;i<=3;i++){
    const el = document.getElementById('s'+i);
    el.className = 'step-item' + (i<n?' done':i===n?' active':'');
    el.querySelector('.step-icon').textContent = i<n?'✅':i===n?'🔄':'⏳';
  }
}

function showError(msg){
  document.getElementById('ld').style.display='none';
  document.getElementById('sb').disabled=false;
  const eb=document.getElementById('eb');
  eb.style.display='block';
  eb.textContent='❌ '+msg;
}

// ① 抓台灣證交所即時股價
async function fetchTWSEPrice(code){
  try{
    const url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_'+code+'.tw&json=1&delay=0';
    const proxy = 'https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    const res = await fetch(proxy);
    const data = await res.json();
    const d = data?.msgArray?.[0];
    if(!d) return null;
    return {
      name: d.n,
      code: d.c,
      price: parseFloat(d.z)||parseFloat(d.y),
      open: parseFloat(d.o),
      high: parseFloat(d.h),
      low: parseFloat(d.l),
      close: parseFloat(d.y), // 昨收
      volume: parseInt(d.v),
      change: (parseFloat(d.z)||parseFloat(d.y)) - parseFloat(d.y),
      changePct: (((parseFloat(d.z)||parseFloat(d.y)) - parseFloat(d.y))/parseFloat(d.y)*100)
    };
  }catch(e){ return null; }
}

// ② 抓歷年EPS（公開資訊觀測站）
async function fetchEPSHistory(code){
  try{
    // 用 goodinfo API proxy
    const url = 'https://goodinfo.tw/tw/StockFinDetail.asp?STOCK_ID='+code+'&RPT_CAT=Q_EPSy';
    const proxy = 'https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    const res = await fetch(proxy, {headers:{'User-Agent':'Mozilla/5.0'}});
    const html = await res.text();
    
    // 解析HTML抓EPS資料
    const rows = [];
    const regex = /<tr[^>]*>[\s\S]*?<\/tr>/gi;
    const tdRegex = /<td[^>]*>([\s\S]*?)<\/td>/gi;
    const matches = html.match(regex)||[];
    
    for(const row of matches){
      const cells = [];
      let m;
      const tdr = /<td[^>]*>([\s\S]*?)<\/td>/gi;
      while((m=tdr.exec(row))!==null){
        const txt = m[1].replace(/<[^>]+>/g,'').trim();
        cells.push(txt);
      }
      if(cells.length>=2 && /^\d{4}$/.test(cells[0])){
        const yr = parseInt(cells[0]);
        const eps = parseFloat(cells[1]);
        if(yr>=1990 && yr<=2030 && !isNaN(eps)){
          rows.push({year:yr, eps:eps});
        }
      }
    }
    
    if(rows.length > 0) return rows.sort((a,b)=>a.year-b.year);
    return null;
  }catch(e){ return null; }
}

// ③ Groq AI分析（只做文字部分，不猜數字）
async function fetchAIAnalysis(code, name, priceData, mode){
  const now = new Date();
  const cy = now.getFullYear();
  const cq = Math.ceil((now.getMonth()+1)/3);
  const full = mode==='full';
  
  const prompt = '請分析台灣上市公司股票代號'+code+'（'+(name||code)+'）。現在是'+cy+'年Q'+cq+'。'+
    '請回覆純JSON格式，不要markdown，格式如下：'+
    '{"industry":"產業分類2~4字",'+
    '"analogy":"用2~3句話生活化解釋這公司做什麼，讓小學生懂",'+
    '"roe_comment":"ROE近年表現一句話評語",'+
    '"target_price":"法人平均目標價（寫明約幾元）",'+
    '"price_comment":"目前股價與目標價相比的評語",'+
    '"dividend_comment":"股利政策特色一句話",'+
    '"eps_q_forecast":['+
    '{"q":"'+cy+' Q'+cq+'","eps":數字,"note":"已公布或預估"},'+
    '{"q":"'+cy+' Q'+(cq<4?cq+1:1)+'","eps":數字,"note":"法人預估"},'+
    '{"q":"'+(cq<3?cy:cy+1)+' Q'+(cq<3?cq+2:cq-2)+'","eps":數字,"note":"法人預估"},'+
    '{"q":"'+(cq<2?cy:cy+1)+' Q'+(cq<2?cq+3:cq-1)+'","eps":數字,"note":"法人預估"}'+
    '],'+
    '"risks":["風險1","風險2","風險3"]'+
    (full?',"revenue_trend":"營收趨勢一句話","competitors":["對手1","對手2"],"technical":"技術面簡評"':'')+
    '}';

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
    body:JSON.stringify({
      model:'openai/gpt-oss-20b',
      messages:[
        {role:'system',content:'你是台灣股市分析師，只回覆純JSON，不加任何說明文字。'},
        {role:'user',content:prompt}
      ],
      max_tokens:800,
      temperature:0.3
    })
  });
  if(!res.ok){ const e=await res.json(); throw new Error('AI錯誤 '+res.status+'：'+(e?.error?.message||'未知')); }
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content||'';
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

let currentMode = 'lite';

async function doSearch(){
  const input = document.getElementById('si').value.trim().replace(/[^0-9]/g,'');
  if(!input){ showError('請輸入純數字股票代號（如：2330）'); return; }

  document.getElementById('eb').style.display='none';
  document.getElementById('ra').style.display='none';
  document.getElementById('ld').style.display='block';
  document.getElementById('sb').disabled=true;
  setStep(1,'active');

  try{
    // Step 1: 即時股價
    const priceData = await fetchTWSEPrice(input);
    setStep(2,'active');

    // Step 2: 歷年EPS
    const epsHistory = await fetchEPSHistory(input);
    setStep(3,'active');

    // Step 3: AI分析
    const aiData = await fetchAIAnalysis(input, priceData?.name, priceData, currentMode);

    document.getElementById('ld').style.display='none';
    document.getElementById('sb').disabled=false;
    renderResult(input, priceData, epsHistory, aiData);
  }catch(err){
    showError(err.message);
  }
}

function renderResult(code, price, epsHist, ai){
  const now = new Date();
  const cy = now.getFullYear();

  // 股價區塊
  let priceHtml='';
  if(price && price.price){
    const chg = price.change||0;
    const chgPct = price.changePct||0;
    const chgCls = chg>=0?'price-up':'price-down';
    const chgSign = chg>=0?'+':'';
    priceHtml=`
    <div class="price-section">
      <div class="price-row">
        <div>
          <div class="source-tag">📡 台灣證交所即時報價</div>
          <div class="price-main" style="margin-top:6px">
            <div class="price-num">NT$ ${price.price.toFixed(2)}</div>
            <div class="${chgCls}">${chgSign}${chg.toFixed(2)} (${chgSign}${chgPct.toFixed(2)}%)</div>
          </div>
        </div>
        <div class="price-stats">
          <div class="pstat"><div class="pstat-label">開盤</div><div class="pstat-val">${price.open||'—'}</div></div>
          <div class="pstat"><div class="pstat-label">最高</div><div class="pstat-val c-green">${price.high||'—'}</div></div>
          <div class="pstat"><div class="pstat-label">最低</div><div class="pstat-val c-red">${price.low||'—'}</div></div>
          <div class="pstat"><div class="pstat-label">昨收</div><div class="pstat-val">${price.close||'—'}</div></div>
        </div>
      </div>
    </div>`;
  } else {
    priceHtml=`<div class="notice" style="margin-top:12px">⚠️ 即時股價查詢失敗（盤後或代號錯誤），僅顯示AI分析資料</div>`;
  }

  // EPS歷史圖表
  const validEps = epsHist||[];
  const epsAvg = validEps.length?(validEps.reduce((s,r)=>s+r.eps,0)/validEps.length).toFixed(2):0;
  const epsSource = validEps.length>0?'公開資訊觀測站真實資料':'AI估算';
  const epsTag = validEps.length>0?'source-tag':'ai-tag';

  // 未來EPS預估
  const forecast = ai?.eps_q_forecast||[];

  // 渲染
  const ra = document.getElementById('ra');
  ra.innerHTML=`
  <div class="stock-header">
    <div class="stock-top">
      <div>
        <div class="stock-name">${price?.name||('股票 '+code)}</div>
        <div class="stock-code">📌 ${code} ｜ 🏭 ${ai?.industry||'—'} ｜ 查詢時間：${now.toLocaleString('zh-TW')}</div>
      </div>
      <div class="industry-badge">${ai?.industry||'—'}</div>
    </div>
    ${priceHtml}
  </div>

  <div class="cards-grid">
    <div class="icard">
      <div class="icard-label">🎯 法人目標價 <span class="ai-tag">AI參考</span></div>
      <div class="icard-val c-gold" style="font-size:16px">${ai?.target_price||'—'}</div>
      <div class="icard-sub">${ai?.price_comment||''}</div>
    </div>
    <div class="icard">
      <div class="icard-label">💵 股利政策 <span class="ai-tag">AI參考</span></div>
      <div class="icard-val c-green" style="font-size:14px;line-height:1.4">${ai?.dividend_comment||'—'}</div>
    </div>
    <div class="icard">
      <div class="icard-label">📊 近年EPS均值 <span class="${epsTag}">${epsSource}</span></div>
      <div class="icard-val c-blue">${epsAvg} 元</div>
      <div class="icard-sub">共 ${validEps.length} 年資料</div>
    </div>
  </div>

  <div class="scard">
    <div class="scard-title">🏭 公司在做什麼？<span class="ai-tag">AI分析</span></div>
    <div style="background:#1c2230;border-left:3px solid #2563eb;border-radius:0 8px 8px 0;padding:13px 16px;font-size:14px;line-height:1.7">${ai?.analogy||'—'}</div>
  </div>

  <div class="scard">
    <div class="scard-title">
      📊 歷年EPS走勢（上市至今）
      <span class="${epsTag}" style="margin-left:4px">${epsSource}</span>
    </div>
    ${validEps.length>0?`
    <div class="chart-wrap"><canvas id="epsChart"></canvas></div>
    <div class="notice">📡 資料來源：公開資訊觀測站，共 ${validEps.length} 年實際財報資料（均值 ${epsAvg} 元）</div>
    `:`<div class="notice">⚠️ 歷年EPS資料查詢失敗，請直接至 goodinfo.tw 查詢</div>`}
  </div>

  <div class="scard">
    <div class="scard-title">📅 近期季度EPS（${cy}年）<span class="ai-tag">AI參考估算</span></div>
    <table class="eps-tbl">
      <tr><th>季度</th><th>EPS（元）</th><th>備註</th></tr>
      ${forecast.map(r=>{
        const cls=r.eps>=0?'ep':'en';
        return `<tr><td>${r.q}</td><td class="${cls}">${r.eps>0?'+':''}${r.eps}</td><td style="color:#8b949e;font-size:12px">${r.note||''}</td></tr>`;
      }).join('')}
    </table>
    <div class="notice">⚠️ 季度EPS為AI參考估算，請以公司正式財報公布為準</div>
  </div>

  <div class="scard">
    <div class="scard-title">⚠️ 主要風險<span class="ai-tag">AI分析</span></div>
    <div class="risk-list">
      ${(ai?.risks||[]).map((r,i)=>{
        const colors=['#ef4444','#f59e0b','#8b949e'];
        return `<div class="risk-row"><div class="rdot" style="background:${colors[i]||'#8b949e'}"></div><div>${r}</div></div>`;
      }).join('')}
    </div>
  </div>

  ${ai?.revenue_trend?`
  <div class="scard">
    <div class="scard-title">🔍 完整版補充<span class="ai-tag">AI分析</span></div>
    <table class="eps-tbl">
      ${ai.revenue_trend?`<tr><td style="color:#8b949e;width:100px">營收趨勢</td><td>${ai.revenue_trend}</td></tr>`:''}
      ${ai.competitors?`<tr><td style="color:#8b949e">主要競爭對手</td><td>${ai.competitors.join('、')}</td></tr>`:''}
      ${ai.technical?`<tr><td style="color:#8b949e">技術面</td><td>${ai.technical}</td></tr>`:''}
    </table>
  </div>`:''}
  `;

  ra.style.display='block';

  // 畫EPS圖表
  if(epsChart){ epsChart.destroy(); epsChart=null; }
  if(validEps.length>0){
    const ctx=document.getElementById('epsChart');
    if(ctx){
      const avg=parseFloat(epsAvg);
      epsChart=new Chart(ctx.getContext('2d'),{
        data:{
          labels:validEps.map(r=>r.year+''),
          datasets:[
            {type:'bar',label:'年度EPS（元）',
             data:validEps.map(r=>r.eps),
             backgroundColor:validEps.map(r=>r.eps>=avg?'rgba(37,99,235,0.75)':'rgba(239,68,68,0.65)'),
             borderRadius:4,order:2},
            {type:'line',label:'歷年均值（'+avg+'元）',
             data:validEps.map(()=>avg),
             borderColor:'#f59e0b',borderWidth:2,borderDash:[5,4],
             pointRadius:0,fill:false,order:1}
          ]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{
            legend:{labels:{color:'#8b949e',font:{family:'Noto Sans TC',size:11}}},
            tooltip:{callbacks:{label:c=>` ${c.dataset.label}：${c.parsed.y} 元`}}
          },
          scales:{
            x:{ticks:{color:'#8b949e',maxRotation:45},grid:{color:'#1c2230'}},
            y:{ticks:{color:'#8b949e',callback:v=>v+'元'},grid:{color:'#1c2230'},
               title:{display:true,text:'EPS（元）',color:'#8b949e'}}
          }
        }
      });
    }
  }
}
</script>
</body>
</html>
